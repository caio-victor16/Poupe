<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poupe+ | Configurações</title>
  <!-- Link para o CSS externo -->
  <link rel="stylesheet" href="style8.css">
  <!-- Ícones do Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

 <!-- Menu Lateral -->
<aside>
<div class="brand-wrapper">
<div class="brand">poupe+</div>
<i data-lucide="menu" class="menu-icon"></i>
</div>

<nav class="nav-container">
<ul class="nav-list">
<li class="nav-item"><a href="index4.html"><i data-lucide="home"></i> Início</a></li>
<li class="nav-item active"><a href="index2.html"><i data-lucide="calendar"></i> Gastos</a></li>
<li class="nav-item"><a href="index3.html"><i data-lucide="wallet"></i> Receitas</a></li>
<li class="nav-item"><a href="index9.html"><i data-lucide="bar-chart-3"></i> Relatórios</a></li>
<li class="nav-item"><a href="index6.html"><i data-lucide="target"></i> Metas</a></li>
<li class="nav-item"><a href="index7.html"><i data-lucide="bell"></i> Alertas</a></li>
</ul>

<ul class="nav-list nav-bottom">
<li class="nav-item"><a href="index8.html"><i data-lucide="settings"></i> Configurações</a></li>
<li class="nav-item"><a href="index.html"><i data-lucide="log-out"></i> Sair</a></li>
</ul>
</nav>
</aside>


  <!-- Conteúdo Principal -->
  <main>
    <div class="header">
      <h1>Configurações</h1>
    </div>

    <!-- Grid de Opções de Configuração -->
    <div class="settings-grid">
      
      <!-- Coluna da Esquerda -->
      <div class="settings-column">
        <a href="#" class="setting-card">
          <div class="card-left">
            <i data-lucide="user"></i>
            <span>Perfil</span>
          </div>
          <i data-lucide="chevron-right" class="arrow-icon"></i>
        </a>

        <a href="#" class="setting-card">
          <div class="card-left">
            <i data-lucide="folder"></i>
            <span>Categorias</span>
          </div>
          <i data-lucide="chevron-right" class="arrow-icon"></i>
        </a>

        <a href="#" class="setting-card">
          <div class="card-left">
            <i data-lucide="landmark"></i>
            <span>Contas bancárias</span>
          </div>
          <i data-lucide="chevron-right" class="arrow-icon"></i>
        </a>

        <a href="#" class="setting-card">
          <div class="card-left">
            <i data-lucide="calendar"></i>
            <span>Orçamento mensal</span>
          </div>
          <i data-lucide="chevron-right" class="arrow-icon"></i>
        </a>

        <a href="#" class="setting-card">
          <div class="card-left">
            <i data-lucide="bell"></i>
            <span>Notificações</span>
          </div>
          <i data-lucide="chevron-right" class="arrow-icon"></i>
        </a>
      </div>

      <!-- Coluna da Direita -->
      <div class="settings-column">
        <a href="#" class="setting-card">
          <div class="card-left">
            <i data-lucide="lock"></i>
            <span>Segurança</span>
          </div>
          <i data-lucide="chevron-right" class="arrow-icon"></i>
        </a>

        <div class="setting-card">
          <div class="card-left">
            <i data-lucide="sliders"></i>
            <span>Tema</span>
          </div>
          <div class="theme-value">
            <span>Claro</span>
            <i data-lucide="sun"></i>
          </div>
        </div>

        <a href="#" class="setting-card">
          <div class="card-left">
            <i data-lucide="info"></i>
            <span>Sobre o Poupe+</span>
          </div>
          <i data-lucide="chevron-right" class="arrow-icon"></i>
        </a>

        <a href="login.html" class="setting-card logout-card">
          <div class="card-left">
            <i data-lucide="log-out"></i>
            <span>Sair da conta</span>
          </div>
        </a>
      </div>

    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
