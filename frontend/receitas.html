<!-- =========================
     CONTEÚDO PRINCIPAL
========================= -->

<main>

  <div class="header">

    <h1>Minhas receitas</h1>

    <button class="btn-add" id="btnOpenModal">
      <i data-lucide="plus"></i>
      Adicionar receita
    </button>

  </div>


  <!-- =========================
       SELETOR DE MÊS
  ========================= -->

  <div class="month-selector">

    <!-- Mês anterior -->
    <button
      class="month-btn"
      id="prevMonth"
      type="button"
      title="Mês anterior"
    >
      <i data-lucide="chevron-left"></i>
    </button>


    <!-- Calendário para escolher mês -->
    <div class="month-picker-wrapper">

      <i data-lucide="calendar"></i>

      <input
        type="month"
        id="monthPicker"
        value="2026-08"
        title="Escolher mês"
      >

    </div>


    <!-- Próximo mês -->
    <button
      class="month-btn"
      id="nextMonth"
      type="button"
      title="Próximo mês"
    >
      <i data-lucide="chevron-right"></i>
    </button>

  </div>


  <!-- =========================
       RESUMO
  ========================= -->

  <div class="summary-card">

    <span class="summary-label">
      Total de receitas
    </span>

    <h2
      class="summary-value"
      id="totalDisplay"
    >
      R$ 0,00
    </h2>

  </div>


  <!-- =========================
       TABELA
  ========================= -->

  <div class="table-card">

    <table class="incomes-table">

      <thead>

        <tr>

          <th>Descrição</th>

          <th>Data</th>

          <th>Categoria</th>

          <th class="text-right">
            Valor
          </th>

          <th class="action-header"></th>

        </tr>

      </thead>

      <tbody id="incomesTableBody">
        <!-- Preenchido pelo JavaScript -->
      </tbody>

    </table>

  </div>


  <!-- =========================
       TOTAL
  ========================= -->

  <div class="total-footer-card">

    <span>
      Total de receitas
    </span>

    <strong id="footerTotalDisplay">
      R$ 0,00
    </strong>

  </div>

</main>


<!-- =========================
     MODAL DE NOVA RECEITA
========================= -->

<div
  class="modal-overlay"
  id="modal"
>

  <div class="modal">

    <h2>Nova Receita</h2>


    <form id="incomeForm">


      <!-- Descrição -->

      <div class="form-group">

        <label for="incomeDesc">
          Descrição
        </label>

        <input
          type="text"
          id="incomeDesc"
          placeholder="Ex: Salário, Freelancer..."
          required
        >

      </div>


      <!-- Categoria -->

      <div class="form-group">

        <label for="incomeCategory">
          Categoria
        </label>

        <select
          id="incomeCategory"
          required
        >

          <option
            value=""
            disabled
            selected
          >
            Selecione uma categoria
          </option>

          <option value="Salário">
            Salário
          </option>

          <option value="Trabalho">
            Trabalho
          </option>

          <option value="Investimentos">
            Investimentos
          </option>

          <option value="Outros">
            Outros
          </option>

        </select>

      </div>


      <!-- Valor -->

      <div class="form-group">

        <label for="incomeValue">
          Valor (R$)
        </label>

        <input
          type="number"
          id="incomeValue"
          step="0.01"
          min="0"
          placeholder="Ex: 2500.00"
          required
        >

      </div>


      <!-- Data -->

      <div class="form-group">

        <label for="incomeDate">
          Data
        </label>

        <input
          type="date"
          id="incomeDate"
          required
        >

      </div>


      <!-- Botões -->

      <div class="modal-actions">

        <button
          type="button"
          class="btn-cancel"
          id="btnCancelModal"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="btn-save"
        >
          Salvar Receita
        </button>

      </div>

    </form>

  </div>

</div>


<script>
// Receitas ficam no servidor (tabela receita). A cópia local
// poupePlus_incomes_u<ID> é atualizada por DadosLocais e lida por score e relatórios.

// Data de hoje no fuso do navegador (toISOString usaria UTC: após 21h no Brasil já é amanhã).
function hojeISO(agora = new Date()) {
  const dois = (n) => String(n).padStart(2, '0');
  return `${agora.getFullYear()}-${dois(agora.getMonth() + 1)}-${dois(agora.getDate())}`;
}

function salvarReceitasLocais(lista) {
  localStorage.setItem(chaveUsuario('poupePlus_incomes'), JSON.stringify(lista));
}

// Receitas antigas do navegador vão para o servidor; cada uma só sai daqui
// depois que o servidor confirmar. Inválidas ou recusadas ficam locais.
async function migrarReceitasLocais() {
  const antigas = itensLocais('poupePlus_incomes');
  const migradas = new Set();
  for (const [indice, r] of antigas.entries()) {
    const valor = Number(r.amount);
    if (!r.description || !r.category || !r.date || !(valor > 0)) continue;
    try {
      await ReceitaAPI.criar({ descricao: r.description, categoria: r.category, valor, data: r.date });
      migradas.add(indice);
    } catch (erro) {
      console.error('Não foi possível migrar a receita local:', erro);
    }
  }
  if (migradas.size) {
    salvarReceitasLocais(antigas.filter((_, indice) => !migradas.has(indice)));
  }
  return migradas.size;
}

document.addEventListener('DOMContentLoaded', async () => {
  lucide.createIcons();
  const usuarioId = Sessao.exigirLogin();
  if (!usuarioId) return;

  const modal = document.getElementById('modal');
  const btnOpenModal = document.getElementById('btnOpenModal');
  const btnCancelModal = document.getElementById('btnCancelModal');
  const incomeForm = document.getElementById('incomeForm');
  const tableBody = document.getElementById('incomesTableBody');
  const totalDisplay = document.getElementById('totalDisplay');
  const footerTotalDisplay = document.getElementById('footerTotalDisplay');
  const incomeDateInput = document.getElementById('incomeDate');
  const prevMonth = document.getElementById('prevMonth');
  const nextMonth = document.getElementById('nextMonth');
  const monthPicker = document.getElementById('monthPicker');
  const botaoSalvar = incomeForm.querySelector('button[type="submit"]');

  // Abre no mês atual (antes estava fixo em agosto de 2026).
  const hoje = new Date();
  let selectedDate = new Date(hoje.getFullYear(), hoje.getMonth(), 1);

  incomeDateInput.value = hojeISO();

  function pegarReceitas() {
    try {
      const lista = JSON.parse(localStorage.getItem(chaveUsuario('poupePlus_incomes')) || '[]');
      return Array.isArray(lista) ? lista : [];
    } catch (e) {
      return [];
    }
  }

  function formatMoney(value) {
    return Number(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatDate(dateStr) {
    const parts = String(dateStr || '').split('-');
    return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : String(dateStr || '');
  }

  function updateMonthPicker() {
    const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
    monthPicker.value = `${selectedDate.getFullYear()}-${month}`;
  }

  async function atualizar() {
    await DadosLocais.sincronizarReceitas(usuarioId);
    renderIncomes();
  }

  function renderIncomes() {
    tableBody.innerHTML = '';
    let total = 0;
    const mesSelecionado = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth() + 1).padStart(2, '0')}`;

    // Identificador estável para o botão de excluir: servidor pelo id, local pela posição.
    let indiceLocal = 0;
    const doMes = pegarReceitas()
      .map(item => ({ item, chave: item.origem === 'servidor' ? item.id : `local-${indiceLocal++}` }))
      .filter(({ item }) => String(item.date || '').startsWith(mesSelecionado));

    if (doMes.length === 0) {
      tableBody.innerHTML = `
        <tr>
          <td colspan="5" class="empty-msg">Nenhuma receita cadastrada neste mês.</td>
        </tr>`;
    } else {
      doMes.forEach(({ item, chave }) => {
        total += Number(item.amount);
        const local = item.origem === 'servidor' ? '' : ' (neste navegador)';
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="font-medium">${textoHTML(item.description)}${textoHTML(local)}</td>
          <td class="text-muted">${textoHTML(formatDate(item.date))}</td>
          <td class="text-muted">${textoHTML(item.category)}</td>
          <td class="text-right font-bold">R$ ${formatMoney(item.amount)}</td>
          <td class="action-cell">
            <button class="delete-btn" data-id="${textoHTML(chave)}" title="Excluir">
              <i data-lucide="trash-2"></i>
            </button>
          </td>`;
        tableBody.appendChild(tr);
      });
    }

    const formattedTotal = `R$ ${formatMoney(total)}`;
    totalDisplay.innerText = formattedTotal;
    footerTotalDisplay.innerText = formattedTotal;
    lucide.createIcons();

    document.querySelectorAll('.delete-btn').forEach(button => {
      button.addEventListener('click', event => deleteIncome(event.currentTarget.getAttribute('data-id')));
    });
  }

  prevMonth.addEventListener('click', () => {
    selectedDate.setMonth(selectedDate.getMonth() - 1);
    updateMonthPicker();
    renderIncomes();
  });

  nextMonth.addEventListener('click', () => {
    selectedDate.setMonth(selectedDate.getMonth() + 1);
    updateMonthPicker();
    renderIncomes();
  });

  monthPicker.addEventListener('change', () => {
    if (!monthPicker.value) return;
    const [year, month] = monthPicker.value.split('-');
    selectedDate = new Date(Number(year), Number(month) - 1, 1);
    renderIncomes();
  });

  btnOpenModal.addEventListener('click', () => modal.classList.add('active'));

  function closeModal() {
    modal.classList.remove('active');
    incomeForm.reset();
    incomeDateInput.value = hojeISO();
  }
  btnCancelModal.addEventListener('click', closeModal);

  incomeForm.addEventListener('submit', async event => {
    event.preventDefault();
    const descricao = document.getElementById('incomeDesc').value.trim();
    const categoria = document.getElementById('incomeCategory').value;
    const valor = parseFloat(document.getElementById('incomeValue').value);
    const data = document.getElementById('incomeDate').value;

    if (!descricao || !categoria || !data || !(valor > 0)) {
      alert('Preencha descrição, categoria, data e um valor maior que zero.');
      return;
    }

    botaoSalvar.disabled = true;
    try {
      await ReceitaAPI.criar({ descricao, categoria, valor, data });
    } catch (erro) {
      alert(`Não foi possível salvar: ${erro.message}`);
      return;
    } finally {
      botaoSalvar.disabled = false;
    }

    closeModal();
    // Depois de salvar, vai para o mês da receita.
    const [year, month] = data.split('-');
    selectedDate = new Date(Number(year), Number(month) - 1, 1);
    updateMonthPicker();
    await atualizar();
  });

  async function deleteIncome(chave) {
    if (!confirm('Deseja remover esta receita?')) return;
    if (String(chave).startsWith('local-')) {
      const indice = Number(String(chave).slice('local-'.length));
      salvarReceitasLocais(itensLocais('poupePlus_incomes').filter((_, i) => i !== indice));
      await atualizar();
      return;
    }
    const item = pegarReceitas().find(r => r.id === chave);
    if (!item) return;
    try {
      await ReceitaAPI.excluir(item.id_receita);
    } catch (erro) {
      alert(`Não foi possível excluir: ${erro.message}`);
      return;
    }
    await atualizar();
  }

  updateMonthPicker();
  renderIncomes();                    // mostra a cópia local enquanto busca o servidor
  const migradas = await migrarReceitasLocais();
  await atualizar();
  if (migradas > 0) {
    alert(`${migradas} receita(s) salvas só neste navegador foram enviadas ao servidor.`);
  }
});

</script>

</body>
</html>
