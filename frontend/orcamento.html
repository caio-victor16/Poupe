<main>
<div id="listView">
<div class="header">
<h1>Orçamentos por Categoria</h1>
<button class="btn-add" id="btnShowAddForm" type="button"><i data-lucide="plus"></i>Definir Limite</button>
</div>

<div id="alertasContainer" style="margin-bottom: 20px;"></div>

<div id="orcamentosList"></div>
</div>

<div id="formView" class="hidden">
<div class="form-header">
<button type="button" class="btn-back" id="btnHideAddForm"><i data-lucide="arrow-left"></i>Voltar</button>
<h1>Definir Limite de Gastos</h1>
</div>
<div class="form-card">
<form id="formOrcamento">
<div class="form-group">
<label for="catOrcamento">Categoria</label>
<div class="select-wrapper">
<select id="catOrcamento" required></select>
<i data-lucide="chevron-down" class="select-icon"></i>
</div>
</div>
<div class="form-group">
<label for="limiteValor">Limite Máximo (R$)</label>
<input type="text" inputmode="decimal" id="limiteValor" placeholder="500,00" required>
</div>
<button type="submit" class="btn-submit-large">Salvar Limite</button>
</form>
</div>
</div>
</main>

<script src="api.js"></script>
<script>
// Orçamentos ficam no servidor (orcamento_categoria). O servidor calcula o gasto
// do mês atual por categoria; o navegador só exibe.

// Nomes antigos do formulário local que não existem no banco.
const ALIASES_CATEGORIA = { "estudos": "educação" };

function normalizarCategoria(nome) {
  const chave = String(nome || "").trim().toLowerCase();
  return ALIASES_CATEGORIA[chave] || chave;
}

function salvarOrcamentosLocais(lista) {
  localStorage.setItem(chaveUsuario("poupe_orcamentos"), JSON.stringify(lista));
}

// Limites antigos do navegador vão para o servidor; cada um só sai daqui
// depois que o servidor confirmar. Categoria sem correspondência fica local.
async function migrarOrcamentosLocais(idCategoriaPorNome) {
  const antigos = itensLocais("poupe_orcamentos");
  const migrados = new Set();
  for (const o of antigos) {
    const idCategoria = idCategoriaPorNome[normalizarCategoria(o.categoria)];
    const limite = Number(o.limite);
    if (!idCategoria || !(limite > 0)) continue;
    try {
      await OrcamentoAPI.definir({ id_categoria: Number(idCategoria), limite });
      migrados.add(String(o.id));
    } catch (erro) {
      console.error("Não foi possível migrar o orçamento local:", erro);
    }
  }
  if (migrados.size) {
    salvarOrcamentosLocais(itensLocais("poupe_orcamentos").filter(o => !migrados.has(String(o.id))));
  }
  return migrados.size;
}

document.addEventListener("DOMContentLoaded", async () => {
  lucide.createIcons();
  const usuarioId = Sessao.exigirLogin();
  if (!usuarioId) return;

  const listView = document.getElementById("listView");
  const formView = document.getElementById("formView");
  const btnShowAddForm = document.getElementById("btnShowAddForm");
  const btnHideAddForm = document.getElementById("btnHideAddForm");
  const formOrcamento = document.getElementById("formOrcamento");
  const orcamentosList = document.getElementById("orcamentosList");
  const alertasContainer = document.getElementById("alertasContainer");
  const categoriaInput = document.getElementById("catOrcamento");
  const botaoSalvar = formOrcamento.querySelector('button[type="submit"]');

  let idCategoriaPorNome = {};
  let avisoSincronizacao = "";

  function pegarOrcamentos() {
    try {
      return JSON.parse(localStorage.getItem(chaveUsuario("poupe_orcamentos")) || "[]");
    } catch (e) {
      return [];
    }
  }

  async function carregarCategorias() {
    try {
      const categorias = await CategoriaAPI.listar();
      idCategoriaPorNome = {};
      categoriaInput.innerHTML = "";
      categorias.forEach(cat => {
        idCategoriaPorNome[String(cat.nome).toLowerCase()] = cat.id_categoria;
        const opcao = document.createElement("option");
        opcao.value = cat.id_categoria;
        opcao.textContent = capitalizar(cat.nome);
        categoriaInput.appendChild(opcao);
      });
    } catch (erro) {
      console.error("Erro ao carregar categorias:", erro);
    }
  }

  async function atualizar() {
    const ok = await DadosLocais.sincronizar();
    avisoSincronizacao = ok ? "" : "Não foi possível falar com o servidor; mostrando a última cópia salva.";
    renderizar();
  }

  btnShowAddForm.addEventListener("click", () => {
    listView.classList.add("hidden");
    formView.classList.remove("hidden");
  });
  btnHideAddForm.addEventListener("click", () => {
    formView.classList.add("hidden");
    listView.classList.remove("hidden");
  });

  function renderizar() {
    const todos = pegarOrcamentos();
    const orcamentos = todos.filter(o => o.origem === "servidor");
    const pendentes = todos.filter(o => o.origem !== "servidor");

    let avisos = avisoSincronizacao
      ? `<p class="text-muted" style="margin-bottom: 12px;">${textoHTML(avisoSincronizacao)}</p>`
      : "";
    if (pendentes.length > 0) {
      avisos += `<div class="table-card" style="padding: 12px 16px; margin-bottom: 12px;">
        <strong>Limites salvos só neste navegador</strong>
        <p class="text-muted" style="font-size: 13px; margin: 2px 0 8px 0;">A categoria não existe no banco. Defina de novo escolhendo uma categoria da lista.</p>
        ${pendentes.map(o => `<div style="display: flex; justify-content: space-between; align-items: center;">
          <span>${textoHTML(o.categoria)} — R$ ${Number(o.limite).toFixed(2)}</span>
          <button class="delete-btn" data-id="${textoHTML(o.id)}" type="button"><i data-lucide="trash-2"></i></button>
        </div>`).join("")}
      </div>`;
    }

    if (orcamentos.length === 0) {
      alertasContainer.innerHTML = avisos;
      orcamentosList.innerHTML = `<div class="empty-msg"><i data-lucide="pie-chart"></i><p>Nenhum limite definido.</p><small>Defina tetos de gastos para monitorar suas categorias.</small></div>`;
      lucide.createIcons();
      ligarExclusao();
      return;
    }

    let html = `<div style="display: grid; gap: 16px;">`;
    let alertasHtml = avisos;

    orcamentos.forEach(o => {
      const gastoMes = Number(o.gasto_mes) || 0;
      const percentual = Math.round(Number(o.percentual) || 0);

      let corBarra = "var(--primary)";
      let badgeTag = "";

      if (percentual >= 100) {
        corBarra = "#ef4444";
        badgeTag = `<span style="background: #fee2e2; color: #dc2626; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold;">Estourado!</span>`;
        alertasHtml += `<div class="table-card" style="padding: 12px 16px; border-left: 4px solid #ef4444; background: #fff5f5; margin-bottom: 8px;">
          <strong style="color: #dc2626;">🚨 Orçamento Estourado!</strong>
          <p style="font-size: 13px; color: #7f1d1d; margin: 2px 0 0 0;">Você ultrapassou o limite estipulado para <b>${textoHTML(o.categoria)}</b> (${percentual}% usado).</p>
        </div>`;
      } else if (percentual >= 80) {
        corBarra = "#f59e0b";
        badgeTag = `<span style="background: #fef3c7; color: #d97706; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: bold;">Atenção!</span>`;
        alertasHtml += `<div class="table-card" style="padding: 12px 16px; border-left: 4px solid #f59e0b; background: #fffbeb; margin-bottom: 8px;">
          <strong style="color: #d97706;">⚠️ Alerta de Gastos (80%)</strong>
          <p style="font-size: 13px; color: #92400e; margin: 2px 0 0 0;">Você já consumiu ${percentual}% do teto mensal da categoria <b>${textoHTML(o.categoria)}</b>.</p>
        </div>`;
      }

      html += `<div class="table-card" style="padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div>
            <strong>${textoHTML(o.categoria)}</strong> ${badgeTag}
          </div>
          <button class="delete-btn" data-id="${textoHTML(o.id)}" type="button"><i data-lucide="trash-2"></i></button>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px;" class="text-muted">
          <span>Gasto no mês: <b>R$ ${gastoMes.toFixed(2)}</b></span>
          <span>Limite: <b>R$ ${Number(o.limite).toFixed(2)}</b> (${percentual}%)</span>
        </div>
        <div style="background: var(--border-color); border-radius: 8px; height: 10px; overflow: hidden;">
          <div style="background: ${corBarra}; width: ${Math.min(100, Math.max(0, percentual))}%; height: 100%;"></div>
        </div>
      </div>`;
    });

    html += `</div>`;
    alertasContainer.innerHTML = alertasHtml;
    orcamentosList.innerHTML = html;
    lucide.createIcons();
    ligarExclusao();
  }

  function ligarExclusao() {
    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const item = pegarOrcamentos().find(x => String(x.id) === String(btn.dataset.id));
        if (!item) return;
        if (item.origem === "servidor") {
          if (!confirm(`Excluir o limite de ${item.categoria}?`)) return;
          try {
            await OrcamentoAPI.excluir(item.id_orcamento);
          } catch (erro) {
            alert(`Não foi possível excluir: ${erro.message}`);
            return;
          }
        } else {
          salvarOrcamentosLocais(itensLocais("poupe_orcamentos").filter(x => String(x.id) !== String(item.id)));
        }
        await atualizar();
      });
    });
  }

  formOrcamento.addEventListener("submit", async (e) => {
    e.preventDefault();
    const idCategoria = Number(categoriaInput.value);
    const limite = Number(document.getElementById("limiteValor").value.replace(",", "."));

    if (!idCategoria || !(limite > 0)) { alert("Escolha a categoria e um limite maior que zero."); return; }

    botaoSalvar.disabled = true;
    try {
      await OrcamentoAPI.definir({ id_categoria: idCategoria, limite });   // substitui o limite anterior da categoria
    } catch (erro) {
      alert(`Não foi possível salvar: ${erro.message}`);
      return;
    } finally {
      botaoSalvar.disabled = false;
    }
    formOrcamento.reset();
    formView.classList.add("hidden");
    listView.classList.remove("hidden");
    await atualizar();
  });

  renderizar();                       // mostra a cópia local enquanto busca o servidor
  await carregarCategorias();
  await migrarOrcamentosLocais(idCategoriaPorNome);
  await atualizar();
  // Registra na tela de Alertas as categorias em risco (o servidor evita repetir no mesmo dia).
  OrcamentoAPI.verificar(usuarioId).catch(erro => console.error("Erro ao verificar orçamentos:", erro));
});
</script>
</body>
