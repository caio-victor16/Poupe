    <link rel="stylesheet" href="alertas.css">

    <!-- Ícones do Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="api.js" defer></script>
</head>

<body>

<!-- Menu Lateral -->
<aside>
<div class="brand-wrapper">
<div class="brand">poupe+</div>
<i data-lucide="menu" class="menu-icon"></i>
</div>

<nav class="nav-container">
<ul class="nav-list">
<li class="nav-item"><a href="inicio.html"><i data-lucide="home"></i> Início</a></li>
<li class="nav-item"><a href="gastos.html"><i data-lucide="calendar"></i> Gastos</a></li>
<li class="nav-item"><a href="receitas.html"><i data-lucide="wallet"></i> Receitas</a></li>
<li class="nav-item"><a href="relatorios.html"><i data-lucide="bar-chart-3"></i> Relatórios</a></li>
<li class="nav-item"><a href="metas.html"><i data-lucide="target"></i> Metas</a></li>

</ul>
</nav>
</aside>



<!-- Conteúdo Principal -->
<main>

    <!-- Topo da Página -->
    <header class="page-header">
        <h1>Alertas</h1>
    </header>


    <!-- Lista de Cards de Alertas -->
    <div class="alerts-container" id="alertsList">
        <!-- Alertas inseridos pelo JavaScript -->
    </div>


    <!-- Botão Ver todos os alertas -->
    <button class="btn-all-alerts" id="btnAllAlerts">

        <span id="btnText">Ver todos os alertas</span>

        <i data-lucide="chevron-down" id="btnIcon"></i>

    </button>

</main>


<script>

document.addEventListener('DOMContentLoaded', async () => {

    // Ativa os ícones do Lucide
    lucide.createIcons();


    const usuarioId = Sessao.exigirLogin();
    if (!usuarioId) {
        return;
    }


    const alertsListEl = document.getElementById('alertsList');

    const btnAllAlerts = document.getElementById('btnAllAlerts');

    const btnText = document.getElementById('btnText');

    const btnIcon = document.getElementById('btnIcon');


    // Classifica o alerta (vindo do backend) em um estilo visual,
    // já que o backend só manda "tipo" e "mensagem" em texto livre.
    function estiloAlerta(alerta) {
        const msg = (alerta.mensagem || '').toLowerCase();

        if (msg.includes('ultrapassad')) {
            return { type: 'danger', icon: 'trending-up' };
        }

        if (msg.includes('próximo') || msg.includes('proximo')) {
            return { type: 'warning', icon: 'alert-triangle' };
        }

        return { type: 'success', icon: 'bell' };
    }

    function formatarDataAlerta(dataIso) {
        if (!dataIso) return '';

        const d = new Date(dataIso);
        if (isNaN(d.getTime())) return dataIso;

        return d.toLocaleDateString('pt-BR') + ' às ' +
            d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    // Busca os alertas reais do usuário na API
    let alertsData = [];

    try {
        const alertas = await AlertaAPI.listarPorUsuario(usuarioId);

        alertsData = alertas.map((alerta) => {
            const estilo = estiloAlerta(alerta);

            return {
                type: estilo.type,
                icon: estilo.icon,
                title: alerta.tipo ? `Alerta de ${alerta.tipo}` : 'Alerta',
                description: alerta.mensagem,
                date: formatarDataAlerta(alerta.data),
            };
        });
    } catch (erro) {
        console.error('Erro ao carregar alertas:', erro);
        alertsListEl.innerHTML = '<p class="empty-msg">Não foi possível carregar seus alertas.</p>';
    }


    // Controla se todos os alertas estão aparecendo
    let showingAll = false;


    // Função para mostrar os alertas
    function renderAlerts() {

        if (alertsData.length === 0) {
            alertsListEl.innerHTML = '<p class="empty-msg">Nenhum alerta por enquanto. Tudo em ordem!</p>';
            btnAllAlerts.style.display = 'none';
            return;
        }

        alertsListEl.innerHTML = '';


        // Se showingAll for false, mostra somente os 3 primeiros
        // Se for true, mostra todos
        const alertsToShow = showingAll
            ? alertsData
            : alertsData.slice(0, 3);


        alertsToShow.forEach(alert => {

            const card = document.createElement('div');

            card.className = 'alert-card';


            card.innerHTML = `

                <div class="alert-icon-box ${alert.type}">

                    <i data-lucide="${alert.icon}"></i>

                </div>


                <div class="alert-content">

                    <h3>${alert.title}</h3>

                    <p>${alert.description}</p>

                    <span class="alert-date">
                        ${alert.date}
                    </span>

                </div>

            `;


            alertsListEl.appendChild(card);

        });


        // Atualiza os ícones
        lucide.createIcons();

    }


    // Primeiro carregamento
    renderAlerts();


    // Ação do botão "Ver todos os alertas"
    btnAllAlerts.addEventListener('click', () => {

        showingAll = !showingAll;


        if (showingAll) {

            // Mostra todos
            renderAlerts();

            btnText.textContent = 'Mostrar menos alertas';

            btnIcon.setAttribute(
                'data-lucide',
                'chevron-up'
            );

        } else {

            // Volta para apenas 3
            renderAlerts();

            btnText.textContent = 'Ver todos os alertas';

            btnIcon.setAttribute(
                'data-lucide',
                'chevron-down'
            );

        }


        // Atualiza o ícone do botão
        lucide.createIcons();

    });

});
if (localStorage.getItem("poupe-theme") === "dark") {
    document.body.classList.add("dark-mode");
  }
</script>

</body>
</html>
