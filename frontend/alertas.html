<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Poupe+ | Alertas</title>

    <link rel="stylesheet" href="alertas.css">

    <!-- Ícones do Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="api.js" defer></script>
</head>

<body>

<!-- Menu Lateral -->
<aside>
<div class="brand-wrapper">
<div class="brand">poupe+</div>
<i data-lucide="menu" class="menu-icon"></i>
</div>

<nav class="nav-container">
<ul class="nav-list">
<li class="nav-item"><a href="inicio.html"><i data-lucide="home"></i> Início</a></li>
<li class="nav-item"><a href="gastos.html"><i data-lucide="calendar"></i> Gastos</a></li>
<li class="nav-item"><a href="receitas.html"><i data-lucide="wallet"></i> Receitas</a></li>
<li class="nav-item"><a href="relatorios.html"><i data-lucide="bar-chart-3"></i> Relatórios</a></li>
<li class="nav-item"><a href="metas.html"><i data-lucide="target"></i> Metas</a></li>
<li class="nav-item active "><a href="alertas.html"><i data-lucide="bell"></i> Alertas</a></li>
<li class="nav-item "><a href="ia.html"><i data-lucide="sparkles"></i>IA Assistente</a></li>
</ul>

<ul class="nav-list nav-bottom">
<li class="nav-item"><a href="configuracoes.html"><i data-lucide="settings"></i> Configurações</a></li>
<li class="nav-item"><a href="login.html"><i data-lucide="log-out"></i> Sair</a></li>
</ul>
</nav>
</aside>



<!-- Conteúdo Principal -->
<main>

    <!-- Topo da Página -->
    <header class="page-header">
        <h1>Alertas</h1>
    </header>


    <!-- Lista de Cards de Alertas -->
    <div class="alerts-container" id="alertsList">
        <!-- Alertas inseridos pelo JavaScript -->
    </div>


    <!-- Botão Ver todos os alertas -->
    <button class="btn-all-alerts" id="btnAllAlerts">

        <span id="btnText">Ver todos os alertas</span>

        <i data-lucide="chevron-down" id="btnIcon"></i>

    </button>

</main>


<script>

document.addEventListener('DOMContentLoaded', () => {

    // Ativa os ícones do Lucide
    lucide.createIcons();


    const alertsListEl = document.getElementById('alertsList');

    const btnAllAlerts = document.getElementById('btnAllAlerts');

    const btnText = document.getElementById('btnText');

    const btnIcon = document.getElementById('btnIcon');


    // Buscar dados de Gastos no localStorage
    const expenses =
        JSON.parse(localStorage.getItem('poupePlus_expenses')) || [

            {
                description: 'Mercado',
                category: 'Alimentação',
                date: '2026-08-18',
                amount: 320.00
            },

            {
                description: 'Luz',
                category: 'Outros',
                date: '2026-08-18',
                amount: 150.00
            }

        ];


    // Calcular gastos com alimentação
    const foodExpenses = expenses

        .filter(e => e.category === 'Alimentação')

        .reduce(
            (sum, e) => sum + Number(e.amount),
            0
        );


    // Limite de alimentação
    const foodLimit = 400;


    // Porcentagem gasta
    const foodPct = Math.min(
        Math.round((foodExpenses / foodLimit) * 100),
        100
    );


    // Lista de alertas
    const alertsData = [

        {
            type: 'danger',
            icon: 'trending-up',
            title: 'Gasto acima do esperado',
            description: `Você já gastou ${foodPct}% do limite de Alimentação.`,
            date: 'Hoje'
        },

        {
            type: 'warning',
            icon: 'alert-triangle',
            title: 'Conta próxima do vencimento',
            description: 'A conta de Luz vence em 2 dias.',
            date: '18/08/2026'
        },

        {
            type: 'success',
            icon: 'check',
            title: 'Meta quase alcançada',
            description: 'Você já alcançou 80% da sua meta Viagem!',
            date: '17/08/2026'
        },

        {
            type: 'warning',
            icon: 'wallet',
            title: 'Orçamento mensal',
            description: 'Você está se aproximando do limite do seu orçamento.',
            date: '16/08/2026'
        },

        {
            type: 'success',
            icon: 'piggy-bank',
            title: 'Boa economia!',
            description: 'Você conseguiu economizar este mês.',
            date: '15/08/2026'
        }

    ];


    // Controla se todos os alertas estão aparecendo
    let showingAll = false;


    // Função para mostrar os alertas
    function renderAlerts() {

        alertsListEl.innerHTML = '';


        // Se showingAll for false, mostra somente os 3 primeiros
        // Se for true, mostra todos
        const alertsToShow = showingAll
            ? alertsData
            : alertsData.slice(0, 3);


        alertsToShow.forEach(alert => {

            const card = document.createElement('div');

            card.className = 'alert-card';


            card.innerHTML = `

                <div class="alert-icon-box ${alert.type}">

                    <i data-lucide="${alert.icon}"></i>

                </div>


                <div class="alert-content">

                    <h3>${alert.title}</h3>

                    <p>${alert.description}</p>

                    <span class="alert-date">
                        ${alert.date}
                    </span>

                </div>

            `;


            alertsListEl.appendChild(card);

        });


        // Atualiza os ícones
        lucide.createIcons();

    }


    // Primeiro carregamento
    renderAlerts();


    // Ação do botão "Ver todos os alertas"
    btnAllAlerts.addEventListener('click', () => {

        showingAll = !showingAll;


        if (showingAll) {

            // Mostra todos
            renderAlerts();

            btnText.textContent = 'Mostrar menos alertas';

            btnIcon.setAttribute(
                'data-lucide',
                'chevron-up'
            );

        } else {

            // Volta para apenas 3
            renderAlerts();

            btnText.textContent = 'Ver todos os alertas';

            btnIcon.setAttribute(
                'data-lucide',
                'chevron-down'
            );

        }


        // Atualiza o ícone do botão
        lucide.createIcons();

    });

});
if (localStorage.getItem("poupe-theme") === "dark") {
    document.body.classList.add("dark-mode");
  }
</script>

</body>
</html>
