  <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poupe+ | Cadastro</title>
  <link rel="stylesheet" href="login.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="login-container">
    <section class="brand-section">
      <div>
        <h1 class="brand-logo">poupe<span>+</span></h1>
        <p class="brand-headline">comece a organizar<br>suas finanças<br>hoje.</p>
      </div>
    </section>

    <section class="form-section">
      <div class="form-header">
        <h2>Crie sua conta</h2>
        <p>Preencha seus dados para começar</p>
      </div>

      <form id="signupForm">
        <div class="input-group">
          <label for="name">Nome</label>
          <div class="input-wrapper">
            <input type="text" id="name" required>
          </div>
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="email" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="password" minlength="4" required>
          </div>
        </div>

        <div class="input-group">
          <label for="income">Renda mensal</label>
          <div class="input-wrapper">
            <input type="number" id="income" min="0.01" step="0.01" required>
          </div>
        </div>

        <div class="input-group">
          <label for="limit">Limite de gastos</label>
          <div class="input-wrapper">
            <input type="number" id="limit" min="0.01" step="0.01" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">Criar conta</button>
      </form>

      <p class="signup-text">
        Já tem uma conta? <a href="login.html">Entrar</a>
      </p>
    </section>
  </main>
</body>
</html>
