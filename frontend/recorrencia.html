<main>
<div id="listView">
<div class="header">

<div id="formView" class="hidden">

<button type="button" class="btn-back" id="btnHideAddForm"><i data-lucide="arrow-left"></i>Voltar</button>

</div>
<div class="form-card">
<form id="formRecorrencia">
<div class="form-group">
<label for="recDescricao">Descrição</label>
<input type="text" id="recDescricao" placeholder="Ex: Netflix, Aluguel, Academia" required>
</div>
<div class="form-group">
<label for="recTipo">Tipo</label>
<div class="select-wrapper">
<select id="recTipo" required>
<option value="Gasto Fixo">Gasto Fixo</option>
<option value="Receita Fixa">Receita Fixa</option>

<div class="select-wrapper">
<select id="recCategoriaReceita">
<option value="Salário">Salário</option>
<option value="Trabalho">Trabalho</option>
<option value="Investimentos">Investimentos</option>
<option value="Outros">Outros</option>
</select>

</div>
</div>

<input type="text" inputmode="decimal" id="recValor" placeholder="0,00" required>
</div>
<div class="form-group">
<label for="recDia">Dia do Vencimento/Recebimento</label>
<input type="number" min="1" max="31" id="recDia" placeholder="Ex: 5" required>
</div>

<script src="api.js"></script>
<script>
// Gastos fixos (tabela recorrencia_gasto) e receitas fixas (receita_recorrente)
// ficam no servidor e geram gastos/receitas automaticamente no dia.
function proximaData(dia, hoje = new Date()) {
  const montar = (ano, mes) => {
    const ultimoDia = new Date(ano, mes + 1, 0).getDate();
    return new Date(ano, mes, Math.min(dia, ultimoDia));
  };
  const inicioHoje = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  let data = montar(hoje.getFullYear(), hoje.getMonth());
  if (data < inicioHoje) data = montar(hoje.getFullYear(), hoje.getMonth() + 1);
  const dois = (n) => String(n).padStart(2, "0");
  return `${data.getFullYear()}-${dois(data.getMonth() + 1)}-${dois(data.getDate())}`;
}

function diaValido(dia) {
  return Number.isInteger(dia) && dia >= 1 && dia <= 31;
}

function dataBR(iso) {
  const [ano, mes, dia] = String(iso || "").split("-");
  return ano && mes && dia ? `${dia}/${mes}/${ano}` : "";
}

function salvarRecorrenciasLocais(lista) {
  localStorage.setItem(chaveUsuario("poupe_recorrencias"), JSON.stringify(lista));
}

// Gastos fixos antigos (só no navegador) vão para o servidor na categoria "outros".
// Cada item só sai do navegador depois que o servidor confirmar.
async function migrarGastosFixosLocais(nomeCategoriaPorId) {
  const antigos = recorrenciasLocais().filter(r => r.tipo === "Gasto Fixo");
  const idOutros = Object.keys(nomeCategoriaPorId)
    .find(id => String(nomeCategoriaPorId[id]).toLowerCase() === "outros");
  if (antigos.length === 0 || !idOutros) return 0;

  const migrados = new Set();
  for (const r of antigos) {
    const dia = Number(r.dia);
    const valor = Number(r.valor);
    if (!diaValido(dia) || !(valor > 0)) continue;
    try {
      await RecorrenciaAPI.criar({
        id_categoria: Number(idOutros),
        valor,
        descricao: r.descricao || "",
        frequencia: "mensal",
        proxima_data: proximaData(dia),
      });
      migrados.add(String(r.id));
    } catch (erro) {
      console.error("Não foi possível migrar a recorrência local:", erro);
    }
  }
  salvarRecorrenciasLocais(recorrenciasLocais().filter(r => !migrados.has(String(r.id))));
  return migrados.size;
}

document.addEventListener("DOMContentLoaded", async () => {
  lucide.createIcons();
  const usuarioId = Sessao.exigirLogin();
  if (!usuarioId) return;

  const listView = document.getElementById("listView");
  const formView = document.getElementById("formView");
  const btnShowAddForm = document.getElementById("btnShowAddForm");
  const btnHideAddForm = document.getElementById("btnHideAddForm");
  const formRecorrencia = document.getElementById("formRecorrencia");
  const recorrenciasList = document.getElementById("recorrenciasList");
  const tipoInput = document.getElementById("recTipo");
  const grupoCategoria = document.getElementById("grupoCategoria");
  const categoriaInput = document.getElementById("recCategoria");
  const grupoCategoriaReceita = document.getElementById("grupoCategoriaReceita");
  const categoriaReceitaInput = document.getElementById("recCategoriaReceita");
  const botaoSalvar = formRecorrencia.querySelector('button[type="submit"]');

  let nomeCategoriaPorId = {};
  let avisoSincronizacao = "";

  function pegarRecorrencias() {
    try {
      return JSON.parse(localStorage.getItem(chaveUsuario("poupe_recorrencias")) || "[]");
    } catch (e) {
      return [];
    }
  }

  function atualizarCamposPorTipo() {
    const ehGasto = tipoInput.value === "Gasto Fixo";
    grupoCategoria.classList.toggle("hidden", !ehGasto);
    categoriaInput.required = ehGasto;
    grupoCategoriaReceita.classList.toggle("hidden", ehGasto);
    categoriaReceitaInput.required = !ehGasto;
  }

  async function carregarCategorias() {
    try {
      const categorias = await CategoriaAPI.listar();
      nomeCategoriaPorId = {};
      categoriaInput.innerHTML = "";
      categorias.forEach(cat => {
        nomeCategoriaPorId[cat.id_categoria] = cat.nome;
        const opcao = document.createElement("option");
        opcao.value = cat.id_categoria;
        opcao.textContent = capitalizar(cat.nome);
        categoriaInput.appendChild(opcao);
      });
    } catch (erro) {
      console.error("Erro ao carregar categorias:", erro);
    }
  }

  async function atualizar() {
    const ok = await DadosLocais.sincronizar();
    avisoSincronizacao = ok ? "" : "Não foi possível falar com o servidor; mostrando a última cópia salva.";
    renderizar();
  }

  function descreverTipo(r) {
    if (r.origem === "servidor" && r.tipo === "Receita Fixa") {
      return `Receita Fixa · ${r.categoria}`;
    }
    if (r.origem === "servidor") {
      const categoria = capitalizar(nomeCategoriaPorId[r.id_categoria] || "");
      return categoria ? `Gasto Fixo · ${categoria}` : "Gasto Fixo";
    }
    return r.tipo === "Receita Fixa" ? "Receita Fixa (neste navegador)" : `${r.tipo} (neste navegador)`;
  }

  function renderizar() {
    const lista = pegarRecorrencias();
    const aviso = avisoSincronizacao
      ? `<p class="text-muted" style="margin-bottom: 12px;">${textoHTML(avisoSincronizacao)}</p>`
      : "";
    if (lista.length === 0) {
      recorrenciasList.innerHTML = aviso + `<div class="empty-msg"><i data-lucide="repeat"></i><p>Nenhuma recorrência cadastrada.</p><small>Automatize o controle de contas e salários mensais.</small></div>`;
      lucide.createIcons();
      return;
    }

    let html = aviso + `<div class="table-card"><table class="expenses-table"><thead><tr><th>Descrição</th><th>Tipo</th><th>Dia</th><th class="text-right">Valor</th><th></th></tr></thead><tbody>`;
    lista.forEach(r => {
      const corTexto = r.tipo === 'Receita Fixa' ? 'color: #059669;' : '';
      const proxima = r.origem === "servidor" && r.proxima_data ? ` · próxima ${dataBR(r.proxima_data)}` : "";
      html += `<tr>
        <td class="font-medium">${textoHTML(r.descricao)}</td>
        <td><span class="cat-badge"><i data-lucide="calendar"></i>${textoHTML(descreverTipo(r))}</span></td>
        <td class="text-muted">Todo dia ${textoHTML(r.dia)}${textoHTML(proxima)}</td>
        <td class="text-right font-bold" style="${corTexto}">R$ ${Number(r.valor).toFixed(2)}</td>
        <td class="text-right"><button class="delete-btn" data-id="${textoHTML(r.id)}" type="button"><i data-lucide="trash-2"></i></button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    recorrenciasList.innerHTML = html;
    lucide.createIcons();

    document.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const item = pegarRecorrencias().find(x => String(x.id) === String(btn.dataset.id));
        if (!item) return;
        if (item.origem === "servidor") {
          if (!confirm("Excluir esta recorrência? O que já foi gerado continua registrado.")) return;
          try {
            if (item.tipo === "Receita Fixa") {
              await ReceitaRecorrenteAPI.excluir(item.id_receita_recorrente);
            } else {
              await RecorrenciaAPI.excluir(item.id_recorrencia);
            }
          } catch (erro) {
            alert(`Não foi possível excluir: ${erro.message}`);
            return;
          }
        } else {
          salvarRecorrenciasLocais(recorrenciasLocais().filter(x => String(x.id) !== String(item.id)));
        }
        await atualizar();
      });
    });
  }

  btnShowAddForm.addEventListener("click", () => {
    listView.classList.add("hidden");
    formView.classList.remove("hidden");
  });
  btnHideAddForm.addEventListener("click", () => {
    formView.classList.add("hidden");
    listView.classList.remove("hidden");
  });
  tipoInput.addEventListener("change", atualizarCamposPorTipo);

  formRecorrencia.addEventListener("submit", async (e) => {
    e.preventDefault();
    const descricao = document.getElementById("recDescricao").value.trim();
    const tipo = tipoInput.value;
    const valor = Number(document.getElementById("recValor").value.replace(",", "."));
    const dia = Number(document.getElementById("recDia").value);

    if (!descricao || !(valor > 0) || !diaValido(dia)) {
      alert("Preencha descrição, valor maior que zero e dia entre 1 e 31.");
      return;
    }

    botaoSalvar.disabled = true;
    try {
      if (tipo === "Gasto Fixo") {
        await RecorrenciaAPI.criar({
          id_categoria: Number(categoriaInput.value),
          valor,
          descricao,
          frequencia: "mensal",
          proxima_data: proximaData(dia),
        });
      } else {
        await ReceitaRecorrenteAPI.criar({
          descricao,
          categoria: categoriaReceitaInput.value,
          valor,
          dia_mes: dia,
        });
      }
    } catch (erro) {
      alert(`Não foi possível salvar: ${erro.message}`);
      return;
    } finally {
      botaoSalvar.disabled = false;
    }

    formRecorrencia.reset();
    atualizarCamposPorTipo();
    formView.classList.add("hidden");
    listView.classList.remove("hidden");
    await atualizar();
  });

  atualizarCamposPorTipo();
  renderizar();                       // mostra a cópia local enquanto busca o servidor
  await carregarCategorias();
  const migrados = await migrarGastosFixosLocais(nomeCategoriaPorId)
    // Receitas fixas antigas do navegador vão para o servidor na categoria "Outros".
    + await migrarItensLocais("poupe_recorrencias", r => {
      const dia = Number(r.dia), valor = Number(r.valor);
      return r.tipo === "Receita Fixa" && r.descricao && diaValido(dia) && valor > 0
        ? { descricao: r.descricao, categoria: "Outros", valor, dia_mes: dia }
        : null;
    }, ReceitaRecorrenteAPI.criar);
  await atualizar();
  if (migrados > 0) {
    alert(`${migrados} recorrência(s) salvas só neste navegador foram enviadas ao servidor na categoria "Outros".`);
  }
});
</script>
