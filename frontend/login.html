<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poupe+ | Login</title>
  <link rel="stylesheet" href="login.css">
  <script src="api.js" defer></script>
</head>
<body>

  <main class="login-container">
    <!-- Esquerda: Marca e Ilustração -->
    <section class="brand-section">
      <div>
        <h1 class="brand-logo">poupe<span>+</span></h1>
        <p class="brand-headline">controle seus gastos,<br>organize seu mês<br>alcance seus objetivos.</p>
      </div>
      
      <!-- Ilustração SVG representando a carteira e moedas -->
      <svg class="brand-illustration" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="50" width="140" height="90" rx="16" fill="#15803d"/>
        <rect x="15" y="40" width="130" height="20" rx="6" fill="#22c55e" opacity="0.8"/>
        <circle cx="135" cy="95" r="8" fill="#e2e8f0"/>
        <circle cx="150" cy="120" r="16" fill="#4ade80"/>
        <circle cx="170" cy="110" r="14" fill="#22c55e"/>
        <circle cx="170" cy="130" r="12" fill="#16a34a"/>
      </svg>
    </section>

    <!-- Direita: Formulário de Login -->
    <section class="form-section">
      <div class="form-header">
        <h2>Bem-vindo de volta! 👋</h2>
        <p>Faça login para continuar</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Mostrar ou ocultar senha">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            Lembrar de mim
          </label>
          <a href="#" class="forgot-password" onclick="alert('Redirecionando para recuperação de senha...')">Esqueceu sua senha?</a>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>
      </form>

      <div class="divider">
        <span>ou entre com</span>
      </div>

      <button type="button" class="btn-google" id="googleLoginBtn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.99 0 12s.46 3.84 1.26 5.42l4.02-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        Entrar com Google
      </button>

      <p class="signup-text">
        Ainda não tem uma conta? <a href="cadastro.html" onclick="alert('Redirecionando para a página de cadastro...')">Cadastre-se</a>
      </p>
    </section>
  </main>

  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;

  try {
    const usuario = await UsuarioAPI.login(email, senha);
    localStorage.setItem('usuarioId', usuario.id); // Salva a sessão
    window.location.href = 'inicio.html';
  } catch (erro) {
    alert('Email ou senha inválidos!');
  }
});
  </script>
</body>
</html>
