<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poupe+ | Login</title>
  <link rel="stylesheet" href="login.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>

  <main class="login-container">
    <!-- Esquerda: Marca e Ilustração -->
    <section class="brand-section">
      <div>
        <h1 class="brand-logo">poupe<span>+</span></h1>
        <p class="brand-headline">controle seus gastos,<br>organize seu mês<br>alcance seus objetivos.</p>
      </div>
      
      <svg class="brand-illustration" viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="50" width="140" height="90" rx="16" fill="#15803d"/>
        <rect x="15" y="40" width="130" height="20" rx="6" fill="#22c55e" opacity="0.8"/>
        <circle cx="135" cy="95" r="8" fill="#e2e8f0"/>
        <circle cx="150" cy="120" r="16" fill="#4ade80"/>
        <circle cx="170" cy="110" r="14" fill="#22c55e"/>
        <circle cx="170" cy="130" r="12" fill="#16a34a"/>
      </svg>
    </section>

    <!-- Direita: Formulário de Login -->
    <section class="form-section">
      <div class="form-header">
        <h2>Bem-vindo de volta! 👋</h2>
        <p>Faça login para continuar</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Mostrar ou ocultar senha">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            Lembrar de mim
          </label>
          <a href="#" class="forgot-password" id="forgotPasswordLink">Esqueceu sua senha?</a>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>
      </form>

      <div class="divider">
        <span>ou entre com</span>
      </div>

      <button type="button" class="btn-google" id="googleLoginBtn">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.25 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.16 0 9.99 0 12s.46 3.84 1.26 5.42l4.02-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        Entrar com Google
      </button>

      <p class="signup-text">
        Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
      </p>
    </section>
  </main>

  <script>
    // Configuração do Firebase Authentication
    const firebaseConfig = {
      apiKey: "SUA_API_KEY_AQUI",
      authDomain: "seu-projeto.firebaseapp.com",
      projectId: "seu-projeto",
      storageBucket: "seu-projeto.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();

    // 1. Mostrar / Esconder Senha
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';

      eyeIcon.innerHTML = isPassword
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    });

    // 2. Submit do Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = passwordInput.value;

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        localStorage.setItem('usuarioId', userCredential.user.uid);
        window.location.href = 'inicio.html';
      } catch (error) {
        alert('Erro ao entrar: ' + traduzirErro(error.code));
      }
    });

    // 3. Login com Google
    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        localStorage.setItem('usuarioId', result.user.uid);
        window.location.href = 'inicio.html';
      } catch (error) {
        alert('Erro no login com Google: ' + error.message);
      }
    });

    // 4. Esqueci a senha
    document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = prompt('Digite seu e-mail para redefinir a senha:');
      if (email) {
        try {
          await auth.sendPasswordResetEmail(email);
          alert('E-mail de redefinição enviado!');
        } catch (error) {
          alert('Erro: ' + traduzirErro(error.code));
        }
      }
    });

    function traduzirErro(code) {
      switch (code) {
        case 'auth/user-not-found': return 'Usuário não encontrado.';
        case 'auth/wrong-password': return 'Senha incorreta.';
        case 'auth/invalid-email': return 'E-mail inválido.';
        default: return 'Falha na operação.';
      }
    }
  </script>
</body>
</html>
